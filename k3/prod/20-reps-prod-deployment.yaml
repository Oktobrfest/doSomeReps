apiVersion: apps/v1
kind: Deployment
metadata:
  name: reps-prod
  namespace: reps-prod
  labels:
    app: reps-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reps-prod
  template:
    metadata:
      labels:
        app: reps-prod
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
            
      imagePullSecrets:
        - name: regcred
        
      # nodeSelector:
      #   kubernetes.io/hostname: "saron"  

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - jackie


      containers:
        - name: reps
          image: docker.io/oktobrfest/reps@sha256:e50717b6269a462fc83f325787409b256c7e3f3ccd13316e2afb09bb34720152
          imagePullPolicy: Always
          # imagePullPolicy: IfNotPresent

# HANDLED IN DOCKER IMAGE NOW:
          # Your compose used "command: sh entrypoint.sh"
          # Use the full path that exists in your image:
          command: ["/bin/sh","/app/entrypoint.sh"]

# UNTESTED:
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   runAsNonRoot: true
          #   runAsUser: 10001
          #   runAsGroup: 10001
          #   readOnlyRootFilesystem: true


# ###### IMPT TO-DO ######
# CHANGE PRODUCTION TO 'PROD'

          env:
            - name: APP_PORT
              value: "5554"
            - name: FLASK_ENV
              value: "production"
            - name: FLASK_DEBUG
              value: "0"
            - name: FLASK_APP
              value: "wsgi.py"

# ###### IMPT TO-DO ######
# CHANGE PRODUCTION TO 'PROD'
            - name: NODE_ENV
              value: "prod"
            - name: IDE
              value: "vscode"
          
          envFrom:
            - secretRef:
                name: reps-prod-secrets
            - secretRef:
                name: reps-oidc
            - configMapRef:
                name: reps-prod-config
            - configMapRef:
                name: reps-oidc-config

          ports:
            - containerPort: 5554
              name: http

          readinessProbe:
            httpGet:
              path: /
              port: 5554
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "110m"
              memory: "256Mi"
            limits:
              cpu: "5000m"
              memory: "4Gi"

# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: reps-oidc
  labels:
    app: reps
entries:
  - model: authentik_core.group
    id: reps_admin_group
    state: present
    identifiers:
      name: "reps-admin"
    attrs:
      name: "reps-admin"

  - model: authentik_core.group
    id: reps_user_group
    state: present
    identifiers:
      name: "reps-user"
    attrs:
      name: "reps-user"

  - model: authentik_providers_oauth2.oauth2provider
    id: reps_oidc_provider
    state: present
    identifiers:
      name: "reps-oidc"
    attrs:
      name: "reps-oidc"
      client_type: public
      response_types: [code]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      redirect_uris:
        - "https://dev.reps.local.test/auth/callback"
        - "http://dev.reps.local.test/auth/callback"
      signing_key: !Find [authentik_crypto.certificatekey, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      access_token_validity: 3600
      id_token_validity: 3600
      refresh_token_validity: 2592000
      scopes: [openid, profile, email, offline_access]
      # 👇 reference the pre-created mapping by name
      property_mappings:
        - !Find [authentik_providers_oauth2.propertymapping, [name, reps-roles-claim]]

  - model: authentik_core.application
    id: reps_application
    state: present
    identifiers:
      slug: "reps"
    attrs:
      name: "Reps"
      slug: "reps"
      provider: !KeyOf reps_oidc_provider

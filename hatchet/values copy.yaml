postgres:
  enabled: false

# ── RabbitMQ (not needed — using Postgres-backed queue) ────────────────────
rabbitmq:
  enabled: false

# ── Caddy (not needed — use kubectl port-forward or Traefik/Ingress) ───────
caddy:
  enabled: false

# ── Shared config for all Hatchet components ───────────────────────────────
sharedConfig:
  enabled: true
  image:
    tag: "v0.86.12"

  # Internal cluster URL for the API server.
  # After install confirm with:  kubectl get svc -n hatchet
  serverUrl: "http://hatchet-stack-api.hatchet.svc.cluster.local:8080"

  # Cookie domain must match the host you access the API from.
  # Start with port-forward:  kubectl port-forward -n hatchet svc/hatchet-stack-api 8080:8080
  serverAuthCookieDomain: "localhost"
  serverAuthCookieInsecure: "t"
  serverAuthSetEmailVerified: "t"
  serverAuthBasicAuthEnabled: "t"

  # gRPC — workers connect here inside the cluster.
  grpcBroadcastAddress: "hatchet-stack-engine.hatchet.svc.cluster.local:7070"
  grpcInsecure: "t"

  env:
    # ── Use Postgres as the message queue (no RabbitMQ needed) ─────────────
    SERVER_MSGQUEUE_KIND: "postgres"

    # ── Logging ────────────────────────────────────────────────────────────
    SERVER_LOGGER_LEVEL: "info"
    SERVER_LOGGER_FORMAT: "console"
    DATABASE_LOGGER_LEVEL: "warn"
    DATABASE_LOGGER_FORMAT: "console"

    # ── Connection pool sizing (modest for a small install) ────────────────
    DATABASE_MAX_CONNS: "20"
    DATABASE_MIN_CONNS: "2"
    DATABASE_MAX_QUEUE_CONNS: "20"
    DATABASE_MIN_QUEUE_CONNS: "2"

    # ── Internal gRPC (no TLS between components inside the cluster) ───────
    SERVER_GRPC_INSECURE: "true"
    SERVER_INTERNAL_CLIENT_BASE_STRATEGY: "none"

  existingSecret:
    enabled: true
    name: "hatchet-secrets"

    databaseUrlKey: "DATABASE_URL"
    existingSecretKeys:
      defaultAdminPassword: "DEFAULT_ADMIN_PASSWORD"
      defaultAdminEmail: "DEFAULT_ADMIN_EMAIL"

# ── API server ─────────────────────────────────────────────────────────────
api:
  enabled: true
  replicaCount: 1

  migrationJob:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 900

  ingress:
    enabled: false

  health:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 156Mi
    limits:
      memory: 512Mi

# ── Engine / scheduler ─────────────────────────────────────────────────────
engine:
  enabled: true
  nameOverride: engine
  replicaCount: 1

  ingress:
    enabled: false

  health:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 156Mi
    limits:
      memory: 512Mi

# ── Frontend dashboard (enabled for quickstart / debugging) ────────────────
frontend:
  enabled: true

  ingress:
    enabled: false

  service:
    type: ClusterIP
    externalPort: 8080
    internalPort: 80

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

# ── Jobs ───────────────────────────────────────────────────────────────────
quickstartJob:
  enabled: true

workerTokenJob:
  enabled: true

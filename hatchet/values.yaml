# hatchet/values.yaml
# Install/render with:
# helm upgrade --install hatchet-stack hatchet/hatchet-stack \
#   -n hatch \
#   --version 0.11.0 \
#   -f hatchet/values.yaml

# Hatchet platform/server image tag.
# This is NOT the Python SDK version.
# Python app/worker should separately use: hatchet-sdk==1.33.12
image:
  tag: "v0.90.2"

postgres:
  enabled: true
  primary:
    persistence:
      storageClass: "local-path"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - jackie

rabbitmq:
  enabled: false

caddy:
  enabled: true

sharedConfig:
  enabled: true

  image:
    tag: "v0.90.2"

  # Internal service URL for pods/worker tokens.
  # UI still works through: kubectl -n hatch port-forward svc/caddy 8888:8080
  serverUrl: "http://localhost:8888"
  grpcBroadcastAddress: "hatchet-stack-engine.hatch.svc.cluster.local:7070"

  serverAuthCookieDomain: "localhost"
  serverAuthCookieInsecure: "t"
  serverAuthSetEmailVerified: "t"
  serverAuthBasicAuthEnabled: "t"
  grpcInsecure: "t"

  env:
    DATABASE_ENFORCE_UTC_TIMEZONE: "false"
    SERVER_MSGQUEUE_KIND: "postgres"

    SERVER_LOGGER_LEVEL: "info"
    SERVER_LOGGER_FORMAT: "console"
    DATABASE_LOGGER_LEVEL: "warn"
    DATABASE_LOGGER_FORMAT: "console"

    DATABASE_MAX_CONNS: "20"
    DATABASE_MIN_CONNS: "2"
    DATABASE_MAX_QUEUE_CONNS: "20"
    DATABASE_MIN_QUEUE_CONNS: "2"

    SERVER_INTERNAL_CLIENT_BASE_STRATEGY: "none"

api:
  enabled: true
  replicaCount: 1

  # Needed because this chart's subcharts use their own sharedConfig/image values.
  sharedConfig:
    image:
      tag: "v0.90.2"

  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-api"
    tag: "v0.90.2"

  migrationJob:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 900
    image:
      repository: "ghcr.io/hatchet-dev/hatchet/hatchet-migrate"
      tag: "v0.90.2"

  seedJob:
    image:
      repository: "ghcr.io/hatchet-dev/hatchet/hatchet-admin"
      tag: "v0.90.2"

  setupJob:
    image:
      repository: "ghcr.io/hatchet-dev/hatchet/hatchet-admin"
      tag: "v0.90.2"

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 156Mi
    limits:
      memory: 512Mi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - jackie

engine:
  enabled: true
  nameOverride: engine
  replicaCount: 1

  sharedConfig:
    image:
      tag: "v0.90.2"

  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-engine"
    tag: "v0.90.2"

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 156Mi
    limits:
      memory: 512Mi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - jackie

frontend:
  enabled: true
  replicaCount: 1

  sharedConfig:
    image:
      tag: "v0.90.2"

  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-frontend"
    tag: "v0.90.2"

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - jackie

quickstartJob:
  enabled: true

workerTokenJob:
  enabled: true

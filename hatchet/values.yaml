postgres:
  enabled: true

rabbitmq:
  enabled: false      # using the Postgres-backed queue instead

caddy:
  enabled: false      # reach services via port-forward or your own Ingress

# ── ONE sharedConfig block (you had two; the second clobbered your tag) ────
sharedConfig:
  enabled: true

  image:
    tag: "v0.86.12"   # chart default is ~v0.84.0; this is a small, safe bump

  # These names embed release "hatchet-stack" + namespace "hatchet".
  # Change either of those and you must change these to match.
  serverUrl: "http://hatchet-stack-api.hatchet.svc.cluster.local:8080"
  grpcBroadcastAddress: "hatchet-stack-engine.hatchet.svc.cluster.local:7070"

  serverAuthCookieDomain: "localhost"
  serverAuthCookieInsecure: "t"
  serverAuthSetEmailVerified: "t"
  serverAuthBasicAuthEnabled: "t"
  grpcInsecure: "t"

  env:
    DATABASE_ENFORCE_UTC_TIMEZONE: "false"
    SERVER_MSGQUEUE_KIND: "postgres"

    # External Postgres? Uncomment and set this (and postgres.enabled: false):
    # DATABASE_URL: "postgresql://hatchet:hatchet@my-pg-host:5432/hatchet?sslmode=disable"

    SERVER_LOGGER_LEVEL: "info"
    SERVER_LOGGER_FORMAT: "console"
    DATABASE_LOGGER_LEVEL: "warn"
    DATABASE_LOGGER_FORMAT: "console"

    DATABASE_MAX_CONNS: "20"
    DATABASE_MIN_CONNS: "2"
    DATABASE_MAX_QUEUE_CONNS: "20"
    DATABASE_MIN_QUEUE_CONNS: "2"

    SERVER_GRPC_INSECURE: "true"
    SERVER_INTERNAL_CLIENT_BASE_STRATEGY: "none"

# ── API server ─────────────────────────────────────────────────────────────
api:
  enabled: true
  replicaCount: 1
  migrationJob:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 900
  ingress:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 156Mi }
    limits:   { memory: 512Mi }

# ── Engine / scheduler ─────────────────────────────────────────────────────
engine:
  enabled: true
  nameOverride: engine
  replicaCount: 1
  ingress:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 156Mi }
    limits:   { memory: 512Mi }

# ── Frontend dashboard OFF (flip to true if you want the UI) ───────────────
frontend:
  enabled: false

# ── Jobs ───────────────────────────────────────────────────────────────────
quickstartJob:
  enabled: true

workerTokenJob:
  enabled: true

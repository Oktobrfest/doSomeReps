# ---------------------------------------------------------------------------
# Hatchet secrets — populate and apply BEFORE installing the Helm chart.
#
# Usage:
#   1. cp hatchet/secret-template.yaml hatchet/secret.yaml
#   2. Fill in every placeholder below with real values.
#   3. kubectl apply -f hatchet/secret.yaml
#   4. Never commit secret.yaml.
#
# Two Secrets live here:
#   hatchet-postgres-auth  — Postgres DB name, user, password (used by the StatefulSet)
#   hatchet-secrets        — Full DATABASE_URL connection string (used by Hatchet)
# ---------------------------------------------------------------------------

# ── Postgres credentials (referenced by hatchet/db/70-statefulset.yaml) ────
apiVersion: v1
kind: Secret
metadata:
  name: hatchet-postgres-auth
  namespace: hatchet
type: Opaque
stringData:
  # The database name Postgres should create on first start.
  POSTGRES_DB: "hatchet"

  # The owner role for that database.
  POSTGRES_USER: "hatchet"

  # A strong, random password. Generate one with:
  #   openssl rand -base64 32
  POSTGRES_PASSWORD: "CHANGE_ME_GENERATE_A_STRONG_PASSWORD"

---
# ── Hatchet application secrets (referenced by values.yaml) ────────────────
apiVersion: v1
kind: Secret
metadata:
  name: hatchet-secrets
  namespace: hatchet
type: Opaque
stringData:
  # Full Postgres connection string — must match the credentials above.
  # The hostname is the service name from hatchet/db/50-service.yaml.
  #
  # Template:
  #   postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@hatchet-postgres.hatchet.svc.cluster.local:5432/<POSTGRES_DB>?sslmode=disable
  #
  # Example (with the defaults above):
  #   postgresql://hatchet:CHANGE_ME_GENERATE_A_STRONG_PASSWORD@hatchet-postgres.hatchet.svc.cluster.local:5432/hatchet?sslmode=disable
  DATABASE_URL: ""
  # Initial admin password for the Hatchet dashboard.
  # Generate one with: openssl rand -base64 24
  DEFAULT_ADMIN_PASSWORD: ""
  DEFAULT_ADMIN_EMAIL: ""

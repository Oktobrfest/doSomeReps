services:
    reps_dev:
        build:
            context: ./
            dockerfile: ./dev.Dockerfile
            args:
                - NODE_ENV=development
        container_name: reps_app
        depends_on:
            - reps_postgres
        ports:
            - "5558:5558" # Debugger port
            - "5553:5553" # App port (Flask)
        environment:
            - FLASK_ENV=development
            - FLASK_APP=wsgi.py
            - FLASK_DEBUG=1
            - NODE_ENV=development
            - IDE=vsdev # Defaulting to vsdev, user can override via CLI or .env
            - APP_PORT=5553
            - DEBUG_PORT=5558
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DB}
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@reps_postgres:5432/${POSTGRES_DB}
            - CACHE_REDIS_HOST=reps_redis
        volumes:
            - ./app:/app
        command: sh entrypoint.sh

        # UNCOMMENT THIS FOR VS-CODE:
    # command: python -m debugpy --wait-for-client --listen 0.0.0.0:5552 -m flask run --host=0.0.0.0  --port=5551 --debugger

    reps_postgres:
        image: postgres:18-alpine
        container_name: reps_postgres
        restart: on-failure:5
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "5432:5432"
        volumes:
            - rep_pg_data_v2:/var/lib/postgresql/data
            - ./postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf

    reps_redis:
        image: redis:7-alpine
        restart: on-failure:3
        ports:
            - "6379:6379"

    pgadmin:
        image: dpage/pgadmin4:9.14
        container_name: reps_pgadmin
        depends_on:
            - reps_postgres
        ports:
            - "5050:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
        volumes:
            - pgadmin_data:/var/lib/pgadmin

volumes:
    rep_pg_data_v2:
        name: "rep_pg_data_v2"
    pgadmin_data:

services:
  reps_dev:
    user: "${UID-1000}:${GID-1000}"
    build:
      context: ./
      # dockerfile: ./dev.Dockerfile
      # dockerfile: ./Dockerfile
      args:
        - NODE_ENV=development
    ports:
      - "5558:5558" # Debugger port
      - "5553:5553" # App port (Flask)

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=wsgi.py
      - FLASK_DEBUG=1
      - NODE_ENV=development
      - IDE=vsdev # Defaulting to vsdev, user can override via CLI or .env
      - APP_PORT=5553
      - DEBUG_PORT=5558
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DRIVER=${DRIVER}
      - CACHE_REDIS_HOST=reps_redis
      - UID=1000
      - GID=1000
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN}
      - HATCHET_CLIENT_HOST_PORT=host.docker.internal:7070
      - HATCHET_CLIENT_SERVER_URL=http://host.docker.internal:8080
      - HATCHET_CLIENT_TLS_STRATEGY=none
    volumes:
      - ./app:/app
      - ./piper_voices:/app/piper_voices
      - ./frontend:/frontend
    command: sh entrypoint.sh

    # UNCOMMENT THIS FOR VS-CODE:
  # command: python -m debugpy --wait-for-client --listen 0.0.0.0:5552 -m flask run --host=0.0.0.0  --port=5551 --debugger

  hatchet_worker:
    build:
      context: ./
      args:
        - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=wsgi.py
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN}
      - HATCHET_CLIENT_HOST_PORT=host.docker.internal:7070
      - HATCHET_CLIENT_SERVER_URL=http://host.docker.internal:8080
      - HATCHET_CLIENT_TLS_STRATEGY=none
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DRIVER=${DRIVER}
    volumes:
      - ./app:/app
      - ./piper_voices:/app/piper_voices
    command: python -m repz.hatchet_workflow


  reps_postgres:
      image: postgres:18-alpine
      container_name: reps_postgres
      restart: on-failure:2
      extra_hosts:
      - "host.docker.internal:host-gateway"
      environment:
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_USER: ${DB_USERNAME}
          POSTGRES_DB: ${DB_NAME}
      ports:
          # - "5432:5432"
          - "5432:5432"
      volumes:
          - rep_pg_data:/var/lib/postgresql
          - ./postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
          - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf

  reps_redis:
    image: redis:7-alpine
    restart: on-failure:3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:9.14
    container_name: reps_pgadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  rep_pg_data:
      name: "rep_pg_data"
  pgadmin_data:

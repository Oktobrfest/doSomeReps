{% extends "base.html" %}
{% block title %}
	Questions for {{ topic_name }}
{% endblock title %}
{% block description %}
<meta name="description" content="{{ topic_name }} practice questions and answers: {{ questions | length }} to study free on DoSomeReps, the spaced repetition learning platform.">
{% endblock description %}
{% block content %}

<div id="topic-questions-root"></div>

<script id="topic-questions-data" type="application/json">
{{ {
  'topicName': topic_name,
  'topicListUrl': url_for('catz.topiclist')
} | tojson }}
</script>

{{ vite_asset("src/entrypoints/TopicQuestions.entry.tsx") }}
{% endblock content %}

{% extends "base.html" %}
{% block footer %}{% endblock %}
{% block content %}
  <div id="audio-quiz-root"></div>
  <script id="audio-quiz-data" type="application/json">
    {{ {
      'initialItems': initial_items,
      'currentUsername': user.username,
      'editQuestionUrl': url_for('home.edit_question'),
      'csrfToken': csrf_token(),
      'categoryList': category_list,
      'selectedCategories': selected_categories if selected_categories != 'Not set' else []
    } | tojson | safe }}
  </script>
  {{ vite_asset("src/entrypoints/AudioQuiz.entry.tsx") }}
{% endblock %}

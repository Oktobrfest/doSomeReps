{% extends "base.html" %}
{% block footer %}{% endblock %}
{% block content %}
  <div id="audio-quiz-root"></div>
  <script id="audio-quiz-data" type="application/json">
    {{ {
      'question': q,
      'audioAssets': audio_assets,
      'currentUsername': user.username,
      'editQuestionUrl': url_for('home.edit_question'),
      'csrfToken': csrf_token()
    } | tojson | safe }}
  </script>
  {{ vite_asset("src/audio/audio_quiz_entry.tsx") }}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% include "categories.html" %}
  </form>
{% endblock %}

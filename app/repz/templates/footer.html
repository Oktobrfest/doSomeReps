{% block footer %}
<footer class="site-footer">
    <div class="container footer-container">
        <div class="footer-brand-group">
            <span class="footer-brand">Do Some Reps</span>
            <a href="{{ url_for('home.about') }}" class="footer-btn">About Us</a>
        </div>
        <div class="footer-contact-group">
            <span class="footer-label">Contact:</span>
            <a href="mailto:daveemail@gmx.com" class="footer-link">daveemail@gmx.com</a>
        </div>
        <div class="footer-copy-group">
            <span class="footer-copy">&copy; <span id="footer-year">2026</span> Do Some Reps. All rights reserved.</span>
        </div>
    </div>
</footer>
<script>
  (function() {
    var el = document.getElementById('footer-year');
    if (el) { el.textContent = new Date().getFullYear(); }
  })();
</script>
{% endblock footer %}

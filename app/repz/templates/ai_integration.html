{% extends 'base.html' %}

{% block title %}AI Integration{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card mt-4 shadow-sm">
            <div class="card-body">
                <!-- React root element -->
                <div id="ai-integration-root">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Loading React UI...</span>
                        </div>
                        <p class="mt-3 text-muted">Loading React App with Vite...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Render React & Vite asset -->
{{ vite_asset("src/main.tsx") }}
{% endblock %}

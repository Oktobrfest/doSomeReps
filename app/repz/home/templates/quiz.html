{% extends "base.html" %}
{% block title %}Quiz{% endblock title %}
{# The quiz owns the full viewport: its action panel is docked to the bottom. #}
{% block footer %}{% endblock %}
{% block content %}
  <div id="quiz-root"></div>
  <script id="quiz-data" type="application/json">
    {{ {
      'currentUsername': user.username,
      'editQuestionUrl': url_for('home.edit_question'),
      'csrfToken': csrf_token(),
      'categoryList': category_list,
      'selectedCategories': selected_categories if selected_categories != 'Not set' else []
    } | tojson | safe }}
  </script>
  {{ vite_asset("src/entrypoints/Quiz.entry.tsx") }}
{% endblock %}
